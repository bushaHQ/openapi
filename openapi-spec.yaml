      summary: List candles
      description: |
        OHLCV rows for one market, oldest first. Each row is an object naming its own fields: `time`, `open`, `high`, `low`, `close`, `volume`, `quote_volume` and `trades`.

        `time` is the RFC3339 instant the interval opened; `open`, `high`, `low`, `close`, `volume` and `quote_volume` are decimal strings, because prices must never be JSON numbers on this surface; `trades` is a count, and so a JSON number.

        `interval` is required. `start_time` and `end_time` bound the window; with neither, the most recent `limit` intervals are returned. `limit` defaults to 200 and is capped at 1000. There is no history ceiling: page back through time with `end_time` rather than being told older data cannot be retrieved. The bar that is still forming is included, and it moves as the market trades.

        Every interval from the market's first trade to the one forming now has a row, as Binance, Kraken and OKX publish klines. An interval nothing traded in is flat at the previous close: `open`, `high`, `low` and `close` are that close, and `volume`, `quote_volume` and `trades` are zero. Intervals before the market's first trade are left out.
