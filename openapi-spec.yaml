      summary: Arm the dead man's switch
      description: |
        Arms a timer that cancels every one of the caller's live orders, on every market, if the caller does not call again before it fires. It is the cheapest safety feature a venue can offer a market maker: a bot whose process dies, whose network partitions or whose container is evicted stops quoting instead of leaving stale orders exposed to a moving market.

        Call it again with the same `timeout_seconds` on a cadence of half the timeout — 15 to 30 seconds for a 60-second window — to keep re-arming. `timeout_seconds: 0` disarms.

        The response names both instants so a client can measure its own clock against the venue's without a second call. If placement is unavailable, this write returns `503 book_busy` by default.
      operationId: setExchangeCancelAllAfter
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCancelAllAfterRequest'
            examples:
              arm:
                summary: Cancel everything if silent for a minute
                value:
                  timeout_seconds: 60
              disarm:
                summary: Disarm
                value:
                  timeout_seconds: 0
      responses:
        '200':
          description: Timer set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeCancelAllAfterResponse'
              examples:
                default:
                  value:
                    status: success
                    message: Cancel-all-after armed
                    data:
                      current_time: '2026-09-06T12:00:00Z'
                      trigger_time: '2026-09-06T12:01:00Z'
        4XX:
          $ref: '#/components/responses/ExchangeError4XX'
        5XX:
          $ref: '#/components/responses/ExchangeError5XX'
  /v1/exchange/orders/{order_id}:
    get:
      tags:
        - Exchange
      security:
        - Auth:
            - exchange:read
            - api:read
      summary: Get one of the caller's orders
      description: |
        One order by its platform id, including orders that have already closed. To look one up by the caller's own reference instead, filter the list with `client_order_id`. An id belonging to another caller is `not_found`, not `forbidden`, so the surface does not confirm that an order it will not show exists. When placement is unavailable, this read serves example orders rather than live orders.
      operationId: getExchangeOrder
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - $ref: '#/components/parameters/OrderIDPathParam'
      responses:
