                      status: partially_filled
                      price: '1372.30'
                      quantity: '5000.00'
                      quote_quantity: null
                      filled_quantity: '1900.00'
                      filled_quote: '2607370.00'
                      remaining_quantity: '3100.00'
                      average_price: '1372.30'
                      maker_fee_rate: '0.0000'
                      taker_fee_rate: '0.0010'
                      created_at: '2026-09-06T11:52:03.884Z'
                      updated_at: '2026-09-06T11:59:58.412Z'
                      expires_at: null
        4XX:
          $ref: '#/components/responses/ExchangeError4XX'
        5XX:
          $ref: '#/components/responses/ExchangeError5XX'
    delete:
      tags:
        - Exchange
      security:
        - Auth:
            - exchange:trade
            - api:write
      summary: Cancel one order
      description: |
        Requests cancellation of one live order and answers with that order. The cancel is accepted, not necessarily applied: the order reaches `cancelled` when the engine acts on it, and a fill that was already in flight still prints. Cancelling an order that has already reached `filled` or `cancelled` is `order_not_cancellable`.

        If placement is unavailable, this write returns `503 book_busy` by default.
      operationId: cancelExchangeOrder
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - $ref: '#/components/parameters/OrderIDPathParam'
      responses:
