openapi: 3.0.0
info:
  title: Busha API
  contact:
    email: developers@busha.co
  description: |
    ## Introduction
    The **Busha API** is designed to provide businesses with tools for borderless financial transactions and operations, enabling modern, global money management. It serves as the backbone for facilitating:
    - Creation and management of multi-currency balances
    - Retrieval of real-time cryptocurrency rates
    - Substantial data insights for business owners

    Whether you’re a product-driven fintech or a developer building integrations, this API significantly accelerates implementation while reducing financial complexities.
    For detailed guides on API integration, visit our [official documentation]().


    ## Authentication
    All API requests require a **Bearer Token** for authentication, passed in the `Authorization` header.
    Your authorization value is a base64 encoded value of your api key and your secret key.
    You can obtain API tokens via your Busha user or business account. Authentication is mandatory to ensure secure and authorized interactions with the API.
    The API keys from the dashboard provides a base64 encoding of the your authorization tokens.

    Your generated Key should look like this:
    `VURtNXhWcHueantkpaiewjo0S044MWsadfojienuoxRTiWDJaeWJaTGxxanZ3Ym10OU1RZnVWajVW=`

    Example Header:
    ``` curl
    Authorization: Bearer VURtNXhWcHueantkpaiewjo0S044MWsadfojienuoxRTiWDJaeWJaTGxxanZ3Ym10OU1RZnVWajVW=
    ```

    ## Error Handling
    #Standardized error responses ensure predictable interactions. Errors are detailed for easy debugging and understanding:
    | **Error Code** | **HTTP Status Code** | **Description** |
    | --- | --- | --- |
    | `bad_request` | 400 | Invalid input or malformed request |
    | `unauthorized` | 401 | Invalid or missing authentication |
    | `not_found` | 404 | Resource not found |
    | `service_unavailable` | 503 | Server error |

    Basic Error Example:
    ``` json
    {
      "error": {
        "name": "bad_request",
        "message": "Invalid input data"
      }
    }
    ```

    Schema Error Body Example:
    ``` json
    {
      "error": {
        "name": "bad_request",
        "message": "Invalid input data"
      },
      "schema": {
        "reason": "The request body is defined as an object. However, it does not meet the schema requirements of the specification",
        "fix": "Ensure that the object being submitted, matches the schema correctly"
      }
    }
    ```

    Field Error Body Example:
    ``` json
    {
      "error": {
        "name": "bad_request",
        "message": "Invalid input data"
      },
      "fields": {
        "field1": [
          {
            "reason": "The request body is defined as an object. However, it does not meet the schema requirements of the specification",
          },
        ],
        "field2": [
          {
            "reason": "The request body is defined as an object. However, it does not meet the schema requirements of the specification",
          }
        ],
      }
    }
    ```

    ## Pagination
    Pagination uses cursors provided as:
    The API supports **cursor-based pagination** for endpoints with large datasets. Pagination uses a `next_cursor` and `previous_cursor` returned in the response.
    Example Response Format:
    ``` json
    {
      "current_entries_size": 10,
      "next_cursor": "base64_cursor_value",
      "previous_cursor": "base64_previous_cursor_value"
    }
    ```

    ## Rate Limiting
    Rate limits determine how many API calls can be made in a rolling minute. This ensures fair and optimized use of system resources.

    The rate limits allowed by each resource will be provided with the header:
    ```curl
    x-rate-limit 100
    ```
    If this header does not exist, then the rate limit is set at a default 100 req/min

    Requests exceeding the allocated quota will receive a `429 Too Many Requests` response.

    ## Rejected business verification
    A business whose verification was rejected is view-only. Every request from its members that changes state answers `400` with `error.name = "profile_rejected"`, including operations whose per-operation error contract does not list that name. Reads, the caller's own session, and notifications stay available. Contact support to reopen the case.

    ##  Common Parameters
    Common parameters enhance consistency across endpoints:
      | **Parameter Name** | **Location** | **Description** | **Example** |
      | --- | --- | --- | --- |
      | `X-BU-PROFILE-ID` | Header | User profile identifier | `BUS_qwejinoiuiqw93ejjw` |
      | `id` | Path | Unique NanoID identifier | `dpt_jweqafajsndiun34fd` |
      | `cursor` | Query | Pagination cursor | `base64_cursor_string` |

    #### Paginated Response Example
      ``` json
      {
        "status": "success",
        "message": "Data retrieved",
        "pagination": {
          "next_cursor": "value_for_next_page",
          "current_entries_size": 20
        },
        "data": [...]
      }
      ```
  version: 1.0.0
servers:
  - url: https://api.sandbox.busha.so
    description: Sandbox Environment
  - url: https://api.busha.io
    description: Production Environment
tags:
  - name: Balances
    description: Handles account balances across different currencies.
  - name: Currencies
    description: |
      Endpoints to manage supported currencies, their properties, and network details.
  - name: Customers
    description: Handle customer requests and responses
  - name: Files
    description: Provides APIs to handle files upload
  - name: Insights
    description: Business analytics insights endpoints
  - name: Miscellaneous
    description: Provides auxiliary APIs to complement and enhance other services.
  - name: Pairs
    description: Access trading pair information and rates
  - name: PaymentLinks
    description: Payment Links
  - name: PaymentRequests
    description: Payment request
  - name: Pledges
    description: Customer-authorized pledge lifecycle APIs
  - name: Quotes
    description: Handle quotes requests and responses
  - name: Recipients
  - name: Transactions
  - name: Transfers
paths:
  /v1/balances:
    post:
      x-rate-limit: 20
      security:
        - Auth:
            - balances:write
            - api:write
      tags:
        - Balances
      operationId: createBalance
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
      summary: Create currency balance
      description: Creates a new balance for managing funds in a specific currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBalanceRequest'
      responses:
        '201':
          description: Balance created successfully
          content:
            application/json:
              schema:
                required:
                  - data
                allOf:
                  - $ref: '#/components/schemas/BaseSchema'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Balance'
        4XX:
          $ref: '#/components/responses/BalanceError4XX'
        5XX:
          $ref: '#/components/responses/BalanceError5XX'
    get:
      security:
        - Auth:
            - balances:read
            - api:read
      tags:
        - Balances
      operationId: listBalances
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - name: currency
          in: query
          schema:
            $ref: '#/components/schemas/Currency'
      summary: List all balances
      description: Retrieves all account balances with their current status.
      responses:
        '200':
          description: List of account balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceListResponse'
        4XX:
          $ref: '#/components/responses/BalanceError4XX'
        5XX:
          $ref: '#/components/responses/BalanceError5XX'
  /v1/balances/{id_or_code}:
    get:
      security:
        - Auth:
            - balances:read
            - api:read
      tags:
        - Balances
      operationId: getBalance
      summary: Get balance details
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - name: id_or_code
          in: path
          required: true
          schema:
            type: string
          description: Balance ID or currency code
      responses:
        '200':
          description: Balance details retrieved successfully
          content:
            application/json:
              schema:
                required:
                  - data
                allOf:
                  - $ref: '#/components/schemas/BaseSchema'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Balance'
        4XX:
          $ref: '#/components/responses/BalanceError4XX'
        5XX:
          $ref: '#/components/responses/BalanceError5XX'
  /v1/currencies:
    get:
      security:
        - AuthOptional: []
      tags:
        - Currencies
      summary: Retrieve supported currencies
      description: |
        Retrieves a list of all supported currencies along with their basic details. This endpoint can be used to display available currencies in wallets or APIs requiring currency data.
      operationId: listCurrencies
      parameters:
        - $ref: '#/components/parameters/XBuPublicKey'
        - $ref: '#/components/parameters/CurrencyType'
        - $ref: '#/components/parameters/SortQueryParam'
        - name: payments_request
          in: query
          required: false
          schema:
            type: boolean
        - name: ramp
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of supported currencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrenciesListResponse'
        4XX:
          $ref: '#/components/responses/CurrenciesError4XX'
        5XX:
          $ref: '#/components/responses/CurrenciesError5XX'
  /v1/currencies/{code}:
    get:
      security:
        - AuthOptional: []
      tags:
        - Currencies
      summary: Retrieve details of a specific currency
      description: |
        Fetches detailed information about a specific currency using its unique code. This includes details such as network support, decimal precision, and transaction limits.
      parameters:
        - $ref: '#/components/parameters/CurrencyCodePathParam'
        - $ref: '#/components/parameters/ProfileHeader'
      operationId: getCurrency
      responses:
        '200':
          description: Details of the requested currency.
          content:
            application/json:
              schema:
                required:
                  - data
                allOf:
                  - $ref: '#/components/schemas/BaseSchema'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Currencies'
        4XX:
          $ref: '#/components/responses/CurrenciesError4XX'
        5XX:
          $ref: '#/components/responses/CurrenciesError5XX'
  /v1/customers:
    post:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Create a new customer
      description: Creates a new customer entry in the system. The required fields depend on the `type` of customer being created ('individual' or 'business').
      operationId: createCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
      requestBody:
        description: Customer details needed to create a new customer.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              individual_customer:
                summary: Individual Customer
                description: An example of a request payload to create an **individual** customer profile.
                value:
                  email: john.doe@example.com
                  has_accepted_terms: true
                  type: individual
                  country_id: NG
                  phone: '+2348012345678'
                  birth_date: 24-12-1990
                  first_name: John
                  last_name: Doe
                  address:
                    street: 123 Main Street
                    city: Lagos
                    state: Lagos
                    postal_code: '100211'
                    country: NG
              business_customer:
                summary: Business Customer
                description: An example of a request payload to create a **business** customer profile. Note the additional `business_*` fields.
                value:
                  email: john.doe@example.com
                  has_accepted_terms: true
                  type: business
                  country_id: NG
                  phone: '+2348098765432'
                  address:
                    street: 456 Corporate Avenue
                    city: Abuja
                    state: FCT
                    postal_code: '900288'
                    country: NG
                  business_name: ABC Corporation
                  business_industry: BIN_C4UvTYR5V8jsOx5LmwQ
                  business_incorporation_date: '2015-06-15'
      responses:
        '201':
          $ref: '#/components/responses/CustomerResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
    get:
      security:
        - Auth:
            - customers:read
            - api:read
      summary: List Customers
      description: List all customers in created for the business
      operationId: listCustomers
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - $ref: '#/components/parameters/CursorQueryParams'
        - $ref: '#/components/parameters/LimitQueryParam'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
            minLength: 3
            example: jane.doe@example.com
      responses:
        '200':
          $ref: '#/components/responses/CustomerListResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/export:
    get:
      security:
        - Auth:
            - customers:read
            - api:read
      summary: Export Customers
      description: Export customers to a csv file
      operationId: exportCustomers
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
        - $ref: '#/components/parameters/CursorQueryParams'
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
            minLength: 3
            example: jane.doe@example.com
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
                format: binary
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/{id}:
    get:
      security:
        - Auth:
            - customers:read
            - api:read
      summary: Get a customer by ID
      description: Retrieve a specific customer by their unique ID
      operationId: getCustomerByID
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
    put:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Update a customer
      description: Update the details of an existing customer
      operationId: updateCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      requestBody:
        description: Customer details to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
    delete:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Delete a customer
      description: Delete a customer by their unique ID
      operationId: deleteCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      responses:
        '204':
          description: Successfully deleted the customer (No Content)
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/{id}/verify:
    post:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Verify a customer
      description: Verify the identity and information provided by a customer
      operationId: verifyCustomer
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      responses:
        '200':
          $ref: '#/components/responses/GeneralResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/{id}/token-share:
    post:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Share customer token
      description: Token sharing.
      operationId: customerTokenShare
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      requestBody:
        required: true
        description: JWT token to be shared for the customer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerTokenShareRequest'
            examples:
              default:
                summary: Token share request
                value:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          $ref: '#/components/responses/GeneralResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/{id}/kyc-link:
    post:
      x-rate-limit: 20
      security:
        - Auth:
            - customers:write
            - api:write
      summary: Generate KYC link for a customer
      description: Generate a KYC verification link for an individual customer
      operationId: generateCustomerKYCLink
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/PathParamNanoID'
        - $ref: '#/components/parameters/ProfileHeader'
      responses:
        '200':
          $ref: '#/components/responses/CustomerKYCLinkResponse'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/customers/industries:
    get:
      security:
        - Auth:
            - customers:read
            - api:read
      summary: List Business Industries
      description: List all business industries
      operationId: listIndustries
      parameters:
        - $ref: '#/components/parameters/ProfileHeader'
      tags:
        - Customers
      responses:
        '200':
          $ref: '#/components/responses/CustomerBusinessIndustries'
        4XX:
          $ref: '#/components/responses/CustomerError4XX'
        5XX:
          $ref: '#/components/responses/CustomerError5XX'
  /v1/exchange/markets:
    get:
      tags:
        - Exchange
      security:
        - AuthOptional:
            - exchange:read
            - api:read
      summary: List exchange markets
      description: |
        Markets that accept new orders and the rules an order against them has to satisfy: the tick, the step, the size bounds, the minimum notional and the display precisions. A bot reads this once at start-up and again whenever a `market_halted`, `price_off_tick` or `quantity_off_step` rejection tells it the copy it holds has gone stale.

        The list is small and unpaginated, as `/v1/pairs` is. Reading it needs no credential; a bearer token is accepted so a client can keep one code path for public and private calls. Read from the venue's own market catalogue; a market that has not been listed under a symbol yet is absent. By default, only `trading`, `post_only` and `limit_only` markets are returned. Set `include_inactive=true` to also load `halted`, `cancel_only` and `delisted` market metadata for existing orders and history. An explicit `status` filter takes precedence over this flag.
      operationId: listExchangeMarkets
      parameters:
        - name: status
          in: query
          required: false
          description: Only markets in this state, including inactive states; overrides include_inactive
          schema:
            $ref: '#/components/schemas/ExchangeMarketStatus'
        - name: include_inactive
          in: query
          required: false
          description: Include inactive market metadata when status is omitted
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Markets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeMarketListResponse'
              examples:
                default:
                  summary: Markets accepting new orders
                  value:
                    status: success
                    message: Markets retrieved
                    data:
                      - symbol: USDT-NGN
                        base_currency: USDT
                        quote_currency: NGN
                        status: trading
                        price_tick: '0.01'
                        quantity_step: '0.01'
                        min_quantity: '10'
                        max_quantity: '500000'
                        min_notional: '5000'
                        price_decimals: 2
                        quantity_decimals: 2
                      - symbol: BTC-NGN
                        base_currency: BTC
                        quote_currency: NGN
                        status: trading
                        price_tick: '1000'
                        quantity_step: '0.00000001'
                        min_quantity: '0.0001'
                        max_quantity: '5'
                        min_notional: '5000'
                        price_decimals: 0
                        quantity_decimals: 8
                      - symbol: BTC-USDT
                        base_currency: BTC
                        quote_currency: USDT
                        status: post_only
                        price_tick: '0.1'
                        quantity_step: '0.00001'
                        min_quantity: '0.0001'
                        max_quantity: '20'
                        min_notional: '5'
                        price_decimals: 1
                        quantity_decimals: 5
        4XX:
          $ref: '#/components/responses/ExchangeError4XX'
        5XX:
          $ref: '#/components/responses/ExchangeError5XX'
  /v1/exchange/markets/{symbol}:
    get:
      tags:
        - Exchange
      security:
        - AuthOptional:
            - exchange:read
            - api:read
      summary: Get one exchange market
      description: |
        One market by symbol, carrying the same trading rules the list does. An unknown symbol is `not_found`, and so is a market the venue has not listed under a symbol.
      operationId: getExchangeMarket
      parameters:
        - $ref: '#/components/parameters/SymbolPathParam'
      responses:
        '200':
          description: Market
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeMarketResponse'
              examples:
                default:
                  value:
                    status: success
                    message: Market retrieved
                    data:
                      symbol: USDT-NGN
                      base_currency: USDT
                      quote_currency: NGN
                      status: trading
                      price_tick: '0.01'
                      quantity_step: '0.01'
                      min_quantity: '10'
                      max_quantity: '500000'
                      min_notional: '5000'
                      price_decimals: 2
                      quantity_decimals: 2
        4XX:
          $ref: '#/components/responses/ExchangeError4XX'
        5XX:
          $ref: '#/components/responses/ExchangeError5XX'
  /v1/exchange/markets/{symbol}/order_book:
    get:
      tags:
        - Exchange
      security:
        - AuthOptional:
            - exchange:read
            - api:read
      summary: Get an order book snapshot
      description: |
        Aggregated depth for one market: `bids` best first and descending, `asks` best first and ascending, each level the positional pair `[price, quantity]`, both decimal strings. The quantity is the total resting size at that price, not one order's.

        `sequence` is the book's revision: the market's own order sequence, read in the same database snapshot as the levels, so it dates them. It only ever moves forward, so two snapshots can be ordered by it — but it counts accepted orders, not book changes, so a cancellation or a fill can change the depth without moving it and a step of more than one is not a gap. **Do not use it to decide whether the book has changed**; compare the `ETag`, which is derived from the levels themselves and therefore moves whenever they do. A conditional re-read with `If-None-Match` answers `304` only when the depth served is byte-for-byte what the client already holds.

        **This endpoint is not part of stream synchronisation.** A client keeping a live book subscribes to `order_book` and joins on the snapshot the stream itself sends in band as its first message; there is no window between the two to reason about and nothing to fetch first. This read is for clients that want depth without holding a socket open. The procedure and the sequencing rules belong to the stream protocol.

        `depth` names how many levels a side returns and must be one of 1, 5, 10, 20, 50, 100 or 500; omitting it returns 50. The depth is aggregated from the resting orders themselves: an order past its own expiry is not liquidity and is left out, because a taker could not have hit it.
      operationId: getExchangeOrderBook
      parameters:
        - $ref: '#/components/parameters/SymbolPathParam'
        - name: depth
          in: query
          required: false
          description: Levels per side. One of 1, 5, 10, 20, 50, 100, 500. Defaults to 50.
          schema:
            type: integer
            enum:
              - 1
              - 5
              - 10
              - 20
              - 50
              - 100
              - 500
            example: 5
      responses:
        '200':
          description: Order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeOrderBookResponse'
              examples:
                default:
                  summary: Five levels a side on USDT-NGN
                  value:
                    status: success
                    message: Order book retrieved
                    data:
                      sequence: 90114627
                      bids:
                        - - '1371.50'
                          - '4200.00'
                        - - '1371.20'
                          - '6150.00'
                        - - '1370.85'
                          - '11800.00'
                        - - '1370.40'
                          - '9300.00'
                        - - '1369.95'
                          - '22450.00'
                      asks:
                        - - '1372.30'
                          - '3100.00'
                        - - '1372.65'
                          - '5400.00'
                        - - '1373.10'
                          - '10250.00'
                        - - '1373.70'
                          - '8800.00'
                        - - '1374.25'
                          - '19600.00'
