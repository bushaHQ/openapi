              $ref: '#/components/schemas/ExchangeTime'
    ExchangeOrderType:
      type: string
      description: |
        `limit` rests at a named price. `market` takes whatever the book offers, bounded by `quote_quantity` on a buy and by `quantity` on a sell.
      enum:
        - limit
        - market
      example: limit
    ExchangeTimeInForce:
      type: string
      description: |
        How long the order may live. `gtc` rests until filled or cancelled. `ioc` fills what it can immediately and cancels the rest. `fok` fills in full immediately or does nothing at all.
      enum:
        - gtc
        - ioc
        - fok
      example: gtc
    ExchangeStpMode:
      type: string
      description: |
        What happens when an order would match the same caller's resting order. `cancel_taker` cancels the incoming order, `cancel_maker` cancels the resting one, `cancel_both` cancels both, and `decrement` takes the crossing quantity off both and lets whatever is left of each carry on. Defaults to `cancel_taker`.

        A self-trade is always prevented: there is no value that lets one print. That is what every major spot venue does — Binance permits its `NONE` mode on none of its live spot symbols, Coinbase Exchange states that self-trading is not allowed, and Kraken applies prevention to every order.
      enum:
        - cancel_taker
        - cancel_maker
        - cancel_both
        - decrement
      example: cancel_taker
    ExchangeOrderStatus:
      type: string
      description: |
        Where the order stands. `open` and `partially_filled` are live and can be cancelled; `filled` and `cancelled` are terminal. A partially filled order that is then cancelled ends `cancelled` with its `filled_quantity` intact.

        A `market` `buy` sized by `quote_quantity` ends `filled` once it has spent the amount: every whole `quantity_step` the amount buys after the taker fee is bought, and what is left, less than one step, returns to the available balance. `filled_quote` plus the taker fee is what was spent. It ends `cancelled` with `immediate_or_cancel` when it bought nothing, when the matching walk stopped before the money ran out, or when a `decrement` self-trade prevention took part of the amount off without spending it.
      enum:
        - open
        - partially_filled
        - filled
        - cancelled
      example: open
    ExchangeCancelReason:
      type: string
      description: |
        Why a `cancelled` order was cancelled. It is the field a maker reads to tell an intentional withdrawal from one the venue forced.

        This is the one field on an order that is **absent** rather than `null` when it does not apply. An enum cannot admit `null` in OpenAPI 3.0 without carrying `null` as a member of the enum itself, which generates a nonsense `"<nil>"` constant a Go client could send by accident; on a trading API that is a worse hazard than one optional key.

        `admin` is a cancel the **venue** made rather than you: a staff member took the order off the book, either on its own or as part of clearing the whole market during an incident. Support can say who and why. It is deliberately not folded into `user_requested`, because a maker reconciling a morning of vanished quotes needs to tell "I cancelled these" from "somebody at the venue did", and only the second is worth a conversation.

        `dust_remainder` means a remainder the book cannot trade: its executable quantity is zero or worth less than one minor unit of the quote asset at its own price (one kobo on an NGN book). Executable quantity is the remainder floored to the quantity step. When the walk reaches it, the venue retires it, returns its collateral, and continues to the next maker. A larger tradeable legacy off-step remainder supplies whole steps; its sub-step crumb is retired the next time it is reached.

        `crossing_depth_exhausted` means the taker still had quantity remaining after reading the market's maximum crossing depth. Its remainder is cancelled and its unused collateral returned rather than resting against makers the bounded read did not reach.
        `price_protection` means a market order's remainder could not fill inside its protection price: the market's reference price less (for a sell) or plus (for a buy) the market's price protection share, fixed when the order arrived. The remainder is cancelled and its unused collateral returned. Place a limit order to trade further from the market.
        `price_band` means the market's price band stopped the order. Its next fill, or the price its remainder would rest at, lay further from the market's reference price than the band allows, or a resting order outside the band stood in its way. The band is the market's breaker threshold either side of the reference price, fixed when the order arrived. The rest is cancelled and its unused collateral returned (FIX OrdRejReason 8, "Price exceeds current price band").
      enum:
        - user_requested
        - cancel_all
        - dead_mans_switch
        - admin
        - dust_remainder
        - crossing_depth_exhausted
        - price_protection
        - price_band
        - post_only_would_cross
        - immediate_or_cancel
        - fill_or_kill
        - self_trade_prevention
        - market_halted
        - expired
        - insufficient_available
      example: user_requested
    ExchangeOrder:
      type: object
      description: |
        One of the caller's orders. Every field is always present and the ones that do not apply are `null` rather than absent, so a client's parser never has to branch on a missing key. The single exception is `cancel_reason`, which is absent on an order that was not cancelled, for the reason its own description gives.
      required:
        - id
        - client_order_id
        - market
        - side
        - type
        - time_in_force
        - post_only
        - stp_mode
        - status
        - price
        - quantity
        - quote_quantity
        - filled_quantity
        - filled_quote
        - remaining_quantity
        - average_price
        - maker_fee_rate
        - taker_fee_rate
        - created_at
        - updated_at
        - expires_at
      properties:
        id:
          type: string
          description: The platform's identifier for the order
          example: exo_3Nd8vYpLwGtE
        client_order_id:
          type: string
          nullable: true
          maxLength: 64
          description: The caller's own reference, or `null` if none was supplied
          example: mm-usdtngn-ask-0090
        market:
          $ref: '#/components/schemas/ExchangeSymbol'
        side:
          $ref: '#/components/schemas/ExchangeSide'
        type:
          $ref: '#/components/schemas/ExchangeOrderType'
        time_in_force:
          $ref: '#/components/schemas/ExchangeTimeInForce'
        post_only:
          type: boolean
          description: Whether the order was placed as post-only
          example: true
        stp_mode:
          $ref: '#/components/schemas/ExchangeStpMode'
        status:
          $ref: '#/components/schemas/ExchangeOrderStatus'
        price:
          type: string
          format: decimal
          nullable: true
          description: The limit price, or `null` on a market order that named no cap
          example: '1372.30'
        quantity:
          type: string
          format: decimal
          nullable: true
          description: The size in the base asset, or `null` on an order sized by `quote_quantity`
          example: '5000.00'
        quote_quantity:
          type: string
          format: decimal
          nullable: true
          description: The spend in the quote asset, or `null` on an order sized by `quantity`
          example: null
        filled_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: How much of the base asset has traded so far. Zero on an untouched order.
          example: '1900.00'
        filled_quote:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            How much of the quote asset has changed hands so far. Carried alongside `filled_quantity` rather than left to the client to multiply, because rounding at each fill makes the product and the sum disagree.
          example: '2607370.00'
        remaining_quantity:
          type: string
          format: decimal
          nullable: true
          description: |
            What is still open on the order: `quantity` less `filled_quantity`, less anything a self-trade decrement removed. It stays as the untraded leftover once the order closes, so a client can see what never traded. It is `null` exactly where `quantity` is null, and otherwise it is the same number the private stream publishes under the same name. For a market buy sized by `quote_quantity`, which has no quantity of its own, this field is null on the order reads while the private stream publishes "0" for the same order.
          example: '3100.00'
        average_price:
          type: string
          format: decimal
          nullable: true
          description: '`filled_quote` divided by `filled_quantity`, or `null` before the first fill'
          example: '1372.30'
        cancel_reason:
          $ref: '#/components/schemas/ExchangeCancelReason'
        maker_fee_rate:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            The fee rate applied to the parts of this order that rested and were taken, as a fraction rather than a percentage. Fixed at placement, so a later tier change does not reprice a resting order.
          example: '0.0000'
        taker_fee_rate:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The fee rate applied to the parts of this order that crossed the spread, as a fraction
          example: '0.0010'
        created_at:
          $ref: '#/components/schemas/TimeStamp'
        updated_at:
          $ref: '#/components/schemas/TimeStamp'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the order expires of its own accord, or `null` for a `gtc` order
          example: null
    ExchangeOrderListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPagination'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeOrder'
    CreateExchangeOrderRequest:
      type: object
      additionalProperties: false
      description: |
        One order. `type`, `time_in_force` and `post_only` are flat and independent rather than fused into a single union key, so the wire format stays readable and extensible; the server refuses an invalid combination by name with `invalid_order_combination`. A property this schema does not declare is refused with `unknown-property` rather than ignored.
      required:
        - market
        - side
        - type
      properties:
        market:
          $ref: '#/components/schemas/ExchangeSymbol'
        side:
          $ref: '#/components/schemas/ExchangeSide'
        type:
          $ref: '#/components/schemas/ExchangeOrderType'
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          pattern: ^-?[0-9]{1,30}(\.[0-9]{1,30})?$
          maxLength: 62
          description: |
            The size in the base asset. Required for a `limit` order and for a `market` `sell`. Mutually exclusive with `quote_quantity`.
          example: '5000.00'
        quote_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          pattern: ^-?[0-9]{1,30}(\.[0-9]{1,30})?$
          maxLength: 62
          description: |
            The amount of the quote asset to spend, for a `market` `buy` that wants to size its spend rather than its acquisition. Mutually exclusive with `quantity`.
          example: '1000000.00'
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          pattern: ^-?[0-9]{1,30}(\.[0-9]{1,30})?$
          maxLength: 62
          description: |
            The limit price, in the quote asset. Required for a `limit` order, and refused on a `market` order of either side, which takes what the book offers and carries no price bound. To bound the price, place a `limit` order with `time_in_force` `ioc`.
          example: '1371.50'
        time_in_force:
          allOf:
            - $ref: '#/components/schemas/ExchangeTimeInForce'
          description: How long the order may live. Defaults to `gtc` for a `limit` order and `ioc` for a `market` one.
          example: gtc
        post_only:
          type: boolean
          description: |
            When true the order will not take liquidity. If it arrives to find a resting order it would have crossed, it is accepted and immediately cancelled with a `cancel_reason` of `post_only_would_cross`, so a maker can never pay a taker fee by accident. That is an outcome and not a refusal: the order existed, ran and closed, and it answers `201` with a `cancelled` order rather than an error. It is `201` and not `200` because an order WAS created; `200` on this operation means the other thing the response table lists, an identical replay of a `client_order_id`, which creates nothing. Defaults to false, and is not accepted on a `market` order.
          example: true
        client_order_id:
          type: string
          maxLength: 64
          description: |
            The caller's own reference, unique among that caller's orders placed in the last 24 hours and among their live orders however old. Sending the same request twice under one id creates one order and answers 200 the second time, which is what makes a retry after a network timeout safe. Sending a *different* request under a held id is `duplicate_client_order_id`.
          example: mm-usdtngn-bid-0091
        stp_mode:
          allOf:
            - $ref: '#/components/schemas/ExchangeStpMode'
          description: Self-trade prevention. Defaults to `cancel_taker`.
          example: cancel_taker
    ExchangeOrderResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ExchangeOrder'
    ExchangeCancelAllAfterRequest:
      type: object
      additionalProperties: false
      description: |
        The dead man's switch. Re-send on a cadence of about half the timeout to keep it armed. A property this schema does not declare is refused with `unknown-property` rather than ignored.
      required:
        - timeout_seconds
      properties:
        timeout_seconds:
          type: integer
          minimum: 0
          maximum: 300
          description: |
            How long the venue waits, in seconds, before cancelling every one of the caller's live orders on every market. `0` disarms an armed timer. The ceiling is five minutes, because a switch that can be armed for an hour is not a safety feature.
          example: 60
    ExchangeCancelAllAfter:
      type: object
      description: |
        Both instants, so a client can measure its own clock drift against the venue's without a second call to `/v1/exchange/time`.
      required:
        - current_time
        - trigger_time
      properties:
        current_time:
          $ref: '#/components/schemas/TimeStamp'
        trigger_time:
          type: string
          format: date-time
          nullable: true
          description: When the cancel will fire if the caller stays silent, or `null` when the timer was disarmed
          example: '2026-09-06T12:01:00Z'
    ExchangeCancelAllAfterResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ExchangeCancelAllAfter'
    ExchangeLiquidity:
      type: string
      description: |
        Whether the caller's order was resting when the fill happened (`maker`) or crossed the spread to cause it (`taker`). Fee rates differ by side, so this is what a rebate reconciliation keys on.
      enum:
        - maker
        - taker
      example: maker
    ExchangeFill:
      type: object
      description: |
        One execution against one of the caller's orders. An order that traded in five prints has five fills, each with the fee actually charged for it.
      required:
        - fill_id
        - order_id
        - client_order_id
        - market
        - side
        - price
        - quantity
        - quote_quantity
        - fee
        - fee_currency
        - liquidity
        - time
      properties:
        fill_id:
          type: string
          description: The venue's identifier for this execution
          example: '9930447'
        order_id:
          type: string
          description: The order this execution filled
          example: exo_3Nd8vYpLwGtE
        client_order_id:
          type: string
          nullable: true
          maxLength: 64
          description: The caller's reference for that order, or `null` if none was supplied
          example: mm-usdtngn-ask-0090
        market:
          $ref: '#/components/schemas/ExchangeSymbol'
        side:
          allOf:
            - $ref: '#/components/schemas/ExchangeSide'
          description: The side of the caller's order, not of the aggressor
          example: sell
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The price this execution printed at
          example: '1372.30'
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The size executed, in the base asset
          example: '1500.00'
        quote_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The value executed, in the quote asset
          example: '2058450.00'
        fee:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The fee charged for this execution. A maker rebate, when one applies, is negative.
          example: '0.00'
        fee_currency:
          type: string
          description: The asset the fee was charged in
          example: NGN
        liquidity:
          $ref: '#/components/schemas/ExchangeLiquidity'
        time:
          $ref: '#/components/schemas/TimeStamp'
    ExchangeFillListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPagination'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeFill'
    ExchangeFee:
      type: object
      required:
        - market
        - maker_fee_rate
        - taker_fee_rate
        - fee_currency
      properties:
        market:
          $ref: '#/components/schemas/ExchangeSymbol'
        maker_fee_rate:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Maker fee as a decimal fraction; negative rates are rebates.
          example: '-0.0001'
        taker_fee_rate:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Taker fee as a nonnegative decimal fraction.
          example: '0.002'
        fee_currency:
          type: string
          description: The market's quote asset, in which fees and rebates settle.
          example: NGN
    ExchangeFeeListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeFee'
    ExchangeStreamToken:
      type: object
      description: A credential with a 15-minute window to authenticate private stream connections; reusable, except that while request proofs are enforced any authenticate spends a device-bound web session's, accepted or refused
      required:
        - token
