      type: object
      required:
        - type
      properties:
        type:
          type: string
          example: address
          description: |
            The payout type. `sweep` is not available to API keys and is
            rejected on API-key requests.
          enum:
            - address
            - bank_transfer
            - mobile_money
            - paybill
            - till
            - payout_batch
            - balance
            - savings
            - direct_debit
            - sweep
            - internal
        recipient_id:
          type: string
          example: 64f00000000000000000000a
          description: |
            This represents the recipient ID, used for `mobile_money` and `bank_transfer` types.
            For `payout_batch`, this should contain the payout batch ID.
        address:
          type: string
          example: tb1qj4263506wyu8khrz2dwce0agk8lhyjgy269rxr
          description: |
            This could be the address, user email or username for type `address`. For type `sweep`, this is the email of the destination account. Required when the sender is the master (master -> sub); optional when the sender is a sub-account (the destination master is resolved automatically from the sub's parent business).
            For type `internal`, this is the destination Busha profile ID, destination email, or a public key that resolves to the owning business profile.
        network:
          type: string
          example: BTC
          description: |
            This specifies the blockchain network associated with the address receiving the payment, typically used with address type payouts.
        memo:
          type: string
          example: memo
          description: |
            This refers to the memo required for blockchain networks that mandate a memo for cryptocurrency transactions.
        narration:
          type: string
          example: Payment for services
          description: |
            A narration or description for the withdrawal. Required for USD bank transfer withdrawals.
        payment_invoice_url:
          type: string
          example: https://cdn.busha.co/invoices/INV-2026-001.pdf
          description: |
            URL of the payment invoice or supporting document, as issued by the platform's upload link
            (`POST /v1/files`). Required for business account USD withdrawals and personal account USD
            withdrawals exceeding $10,000.
