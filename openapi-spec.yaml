          properties:
            data:
              $ref: '#/components/schemas/ExchangeMarket'
    ExchangeOrderBookLevel:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: string
      description: |
        One aggregated price level as the positional pair `[price, quantity]`. Element `0` is the price the level rests at; element `1` is the total size resting there across every order, not one order's.

        Both are decimal strings with trailing zeros **trimmed**, never padded to a fixed width: a level of 1390 for 2 is published as `["1390", "2"]` and not as `["1390.00", "2.00"]`. Nothing on this surface pads a decimal and nothing can — every amount renders through `decimal.String()` — so a client that wants a fixed width formats it itself, reading `price_decimals` and `quantity_decimals` off the market row, which is what those two fields are for. The example below is written out for readability and promises no width; the same rule holds for every decimal on this surface.

        The pair is positional rather than a named object because that is what every venue an integrator has already written against publishes — Binance, Coinbase Exchange and Kraken all return `[price, size]`, and CCXT's unified order book is defined in those terms — so a generic client reads this book without a special case.

        On the `order_book` stream channel a level's quantity is absolute rather than a delta, and a quantity of `"0"` means the price is gone from the book rather than that nothing rests there. The channel's own level shape is part of the stream protocol.
      example:
        - '1371.50'
        - '4200.00'
    TimeStamp:
      type: string
      format: date-time
      example: '2023-10-15T12:15:30Z'
    ExchangeOrderBook:
      type: object
      description: Aggregated depth for one market at one revision of the book
      required:
        - sequence
        - bids
        - asks
        - time
      properties:
        sequence:
          type: integer
          format: int64
          description: |
            The book's revision: the market's own order sequence — the number of orders the venue has accepted on this book — read in the same statement and the same database snapshot as the levels beside it, so it dates them exactly.

            It is monotonic and never decreases, which is what lets two snapshots be ordered. It is **not** a per-change counter, and a client must not treat a step of more than one as a gap: a cancellation or a fill changes the book without advancing it, and a placement advances it whether or not it changed the visible depth. Use it to tell which of two snapshots is newer, not to detect loss and not to detect change — the `ETag` is derived from the levels themselves and is what moves whenever the book does.

            A client keeping a live book joins on the `order_book` stream's own in-band snapshot rather than on this one; the stream's sequencing rules are its own and are part of the stream protocol.
          example: 90114627
        bids:
          type: array
          description: |
            Buy levels as `[price, quantity]` pairs, best (highest) price first, so `bids[0]` is the best bid. Empty when nothing rests on the buy side; never null.
          items:
            $ref: '#/components/schemas/ExchangeOrderBookLevel'
        asks:
          type: array
          description: |
            Sell levels as `[price, quantity]` pairs, best (lowest) price first, so `asks[0]` is the best ask. Empty when nothing rests on the sell side; never null.
          items:
            $ref: '#/components/schemas/ExchangeOrderBookLevel'
        time:
          $ref: '#/components/schemas/TimeStamp'
    ExchangeOrderBookResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ExchangeOrderBook'
    ExchangeSide:
      type: string
      description: The direction of an order or a fill, in terms of the market's base asset
      enum:
        - buy
        - sell
      example: buy
    ExchangeTrade:
      type: object
      description: One print on the public tape
      required:
        - trade_id
        - price
        - quantity
        - taker_side
        - time
      properties:
        trade_id:
          type: string
          description: The venue's identifier for this print, unique within the market
          example: '4820117'
        price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The price the trade printed at
          example: '1372.10'
        quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The size traded, in the base asset
          example: '1500.00'
        taker_side:
          allOf:
            - $ref: '#/components/schemas/ExchangeSide'
          description: |
            The side of the order that crossed the spread to cause this print, so `buy` means the aggressor lifted an offer. Published as itself rather than as a "the buyer was the maker" boolean, which every client would otherwise have to invert.
          example: buy
        time:
          $ref: '#/components/schemas/TimeStamp'
    ExchangeTradeListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorPagination'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeTrade'
    ExchangeCandleInterval:
      type: string
      description: The width of one candle
      enum:
        - 1m
        - 5m
        - 15m
        - 30m
        - 1h
        - 4h
        - 1d
        - 1w
      example: 1h
    ExchangeCandle:
      type: object
      description: |
        One OHLCV interval, named field by field. A candle is an object rather than a positional row because the eight values are of three different kinds — an instant, six decimals and a count — and a positional row could only carry them by making every one of them a string.

        `time` is the instant the interval opened; the candle covers `time` up to one interval width after it. The six prices and volumes are decimal strings, because a price that is a JSON number is a price some client's parser has already rounded. `trades` is a count, so it is a JSON number, as `trade_count_24h` is on the ticker.
      required:
        - time
        - open
        - high
        - low
        - close
        - volume
        - quote_volume
        - trades
      properties:
        time:
          allOf:
            - $ref: '#/components/schemas/TimeStamp'
          description: The instant this interval opened
          example: '2026-09-06T11:00:00Z'
        open:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The first trade's price in the interval, or the previous close when nothing traded
          example: '1371.80'
        high:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The highest price traded in the interval, or the previous close when nothing traded
          example: '1375.90'
        low:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The lowest price traded in the interval, or the previous close when nothing traded
          example: '1371.10'
        close:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The last trade's price in the interval, or the previous close when nothing traded
          example: '1372.10'
        volume:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: How much of the base asset traded in the interval
          example: '102640.00'
        quote_volume:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: What that volume was worth in the quote asset
          example: '140878174.00'
        trades:
          type: integer
          format: int64
          description: How many prints happened in the interval
          example: 341
    ExchangeCandleListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/ExchangeCandle'
    ExchangeTicker:
      type: object
      description: |
        One market's rolling 24-hour summary and its top of book, merged into one payload because a client that wants one nearly always wants the other.
      required:
