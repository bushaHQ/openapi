                    status: success
                    message: Order retrieved
                    data:
                      id: exo_3Nd8vYpLwGtE
                      client_order_id: mm-usdtngn-ask-0090
                      market: USDT-NGN
                      side: sell
                      type: limit
                      time_in_force: gtc
