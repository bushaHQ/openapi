            - $ref: '#/components/schemas/Decimal'
          description: The price of the most recent print
          example: '1372.10'
        best_bid:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The highest resting buy price
          example: '1371.50'
        best_bid_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The total size resting at `best_bid`
          example: '4200.00'
        best_ask:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The lowest resting sell price
          example: '1372.30'
        best_ask_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The total size resting at `best_ask`
          example: '3100.00'
        open_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The price 24 hours ago, on a rolling window rather than a calendar day
          example: '1366.40'
        high_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The highest print in the last 24 hours
          example: '1375.90'
        low_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The lowest print in the last 24 hours
          example: '1364.20'
        volume_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Base-asset volume traded in the last 24 hours
          example: '1842300.55'
        quote_volume_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Quote-asset volume traded in the last 24 hours
          example: '2527845913.20'
        price_change_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: '`last_price` minus `open_24h`, which may be negative'
          example: '5.70'
        price_change_percent_24h:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The same change as a percentage, which may be negative
          example: '0.42'
        trade_count_24h:
          type: integer
          format: int64
          description: How many prints happened in the last 24 hours
          example: 8241
        time:
