    TxnMetaPerps:
      type: object
      description: |
        A perps wallet movement, on rows of type `perps` only: one row per order that opens a
        position, adds to one, or closes all or part of one. An open or an add is a debit of its
        margin and our opening fee; a close is a credit of the margin released and the profit, less
        a loss and our closing fee. Figures are USDT.
      required:
        - outcome
        - market
        - side
        - leverage
        - size
        - paid
        - received
        - pnl
        - pnl_percent
        - trigger
        - position_id
        - order_id
      properties:
        outcome:
          type: string
          enum:
            - opened
            - added
            - partly_closed
            - closed
            - liquidated
          description: |
            What the movement did to the position. `liquidated` is the fill that closed a position Busha's
            liquidation closed; a liquidation's part fill is `partly_closed` with `trigger` `liquidation`.
          example: closed
        market:
          type: string
          example: BTC-PERP
        side:
          type: string
          enum:
            - long
            - short
          example: long
        leverage:
          $ref: '#/components/schemas/Decimal'
        size:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: What the order filled, in the underlying.
          example: '0.006'
        paid:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            What the customer paid for the part of the position the row is about: margin and our
            opening fee. On a close, the share of the position's opens that the close covers.
          example: '96.72'
        received:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: What came back to the USDT wallet; 0 on an open or an add.
          example: '107.262'
        pnl:
          type: string
          nullable: true
          description: received − paid, fees included, on a close; null on an open or an add.
          example: '10.542'
        pnl_percent:
          type: string
          nullable: true
          description: pnl as a percentage of paid, 2 places, on a close; null on an open or an add.
          example: '10.90'
        trigger:
          type: string
          enum:
            - liquidation
            - staff
            - stop_loss
            - take_profit
          nullable: true
          description: |
            What closed the position when the customer did not: `liquidation` for Busha's liquidation,
            `staff` for a close Busha's staff made by hand, and `stop_loss` or `take_profit` for the close
            the customer's stop sent when the mark reached it (each with outcome `closed` or `partly_closed`).
            Null for the customer's own.
          example: null
        position_id:
          type: string
          example: ppos_kd2d6warmn
        order_id:
          type: string
          example: pord_nc31thgkxu
