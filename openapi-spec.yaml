      summary: Cancel every order on one market
      description: |
        Cancels all of the caller's live orders on one market and answers with the orders the cancel applied to. `market` is **required**: a venue-wide cancel with no scope is too easy to fire by accident and too blunt for a maker quoting several books, so it is not offered. Cancel each market in turn, or arm the dead man's switch.

