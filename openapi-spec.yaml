    ExchangeMarketStatus:
      type: string
      description: |
        What a market currently admits. `trading` is normal two-sided trading. `post_only` accepts resting orders but no order that would take, which is how a venue reopens after a halt without letting the first taker cross a thin book. `limit_only` refuses market orders. `cancel_only` accepts no new orders and lets makers withdraw. `halted` accepts nothing. `delisted` is permanent.
      enum:
        - trading
        - post_only
        - limit_only
        - cancel_only
        - halted
        - delisted
      example: trading
    ExchangeSymbol:
      type: string
      description: |
        A market's one canonical identifier: the base asset, a hyphen, the quote asset, all uppercase. `USDT-NGN` means USDT priced in NGN, so a `buy` acquires USDT and spends NGN. The same string is used in paths, query parameters, request bodies and stream subscriptions; there is no second spelling of a market anywhere on this surface.
      pattern: ^[A-Z0-9]{2,10}-[A-Z0-9]{2,10}$
      minLength: 5
      maxLength: 21
      example: USDT-NGN
    ExchangeMarket:
      type: object
      description: |
        One market and every rule an order against it must satisfy. A client that mirrors these values locally can reject a bad order before spending a round trip on it.
      required:
        - symbol
        - base_currency
        - quote_currency
        - status
        - price_tick
        - quantity_step
        - min_quantity
        - max_quantity
        - min_notional
        - price_decimals
        - quantity_decimals
      properties:
        symbol:
          $ref: '#/components/schemas/ExchangeSymbol'
        base_currency:
          type: string
          description: The asset being bought and sold. `quantity` is denominated in it.
          example: USDT
        quote_currency:
          type: string
          description: The asset it is priced in. `price`, `quote_quantity` and notionals are denominated in it.
          example: NGN
        status:
          $ref: '#/components/schemas/ExchangeMarketStatus'
        price_tick:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            The smallest price increment. Every `price` must be a whole multiple of it, or the order is refused with `price_off_tick`.
          example: '0.01'
        quantity_step:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            The smallest size increment. Every `quantity` must be a whole multiple of it, or the order is refused with `quantity_off_step`.
          example: '0.01'
        min_quantity:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: The smallest order size, in the base asset
          example: '10'
        max_quantity:
          type: string
          nullable: true
          description: |
            The largest order size, in the base asset. Null means the book sets no ceiling, which is a different answer from a ceiling of zero.
          example: '500000'
        min_notional:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: |
            The smallest order value in the quote asset. It exists so dust orders cannot be used to clog the book, and it binds independently of `min_quantity`.
          example: '5000'
        price_decimals:
          type: integer
          description: How many decimal places prices are displayed to. Derived from `price_tick` and repeated here so a client need not count.
          example: 2
        quantity_decimals:
          type: integer
          description: How many decimal places quantities are displayed to
          example: 2
    ExchangeMarketListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ExchangeMarket'
    ExchangeMarketResponse:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          required:
